name: CI
on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    env: {DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production, DJANGO_DEBUG: "False", DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1", HOMEHUB_ENV: development}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install poetry
      - run: poetry install --no-interaction
      - run: poetry run pip install -r requirements-integrations.txt -r requirements-dev.txt
      - run: poetry run python homehub/manage.py check
      - run: poetry run python homehub/manage.py makemigrations --check --dry-run
      - run: poetry run pytest
      - run: poetry run ruff check homehub --select E9,F
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
